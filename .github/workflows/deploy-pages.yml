name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 静态托管没有 Node 运行时：标牌库扫描、写盘、AI 代理这三个接口依赖
      # 本地文件系统，只能在本地/离线包里用，导出站点时整目录移除。
      - name: Drop server-only API routes
        run: rm -rf src/app/api

      - name: Build static site
        run: pnpm build
        env:
          # 由 next.config.ts 读取：启用 output: 'export' + trailingSlash
          NEXT_STATIC_EXPORT: '1'
          # 项目站点挂在 /<仓库名> 子路径下，客户端资源统一走 lib/public-url
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Keep Next.js assets untouched by Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
